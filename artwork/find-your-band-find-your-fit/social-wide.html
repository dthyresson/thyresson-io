<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smells Like Team Spirit: PMF Is Gonna Rock Ya! — wide OG</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #111; }
      .card {
        position: relative; width: 1200px; height: 630px;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      .bg {
        position: absolute; inset: -40px;
        background-image: url("../../src/images/post-find-your-band-find-your-fit/hero.png");
        background-size: cover; background-position: center;
        filter: blur(26px) brightness(.62) saturate(1.15);
        transform: scale(1.08);
      }
      .veil { position: absolute; inset: 0; background: rgba(33,9,74,.28); }
      img { position: relative; z-index: 1; height: 630px; width: auto; display: block; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg"></div>
      <div class="veil"></div>
      <img
        src="../../src/images/post-find-your-band-find-your-fit/hero.png"
        alt="Smells Like Team Spirit: PMF Is Gonna Rock Ya!"
      />
    </div>
  </body>
</html>
